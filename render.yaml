services:
  - type: web
    name: ai-clone-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: REDIS_URL
        value: redis://localhost:6379/0
